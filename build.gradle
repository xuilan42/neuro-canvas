plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Reads the WebP icons of Modrinth projects (pure Java, BSD-3); shipped inside our jar.
    implementation "com.twelvemonkeys.imageio:imageio-webp:3.12.0"
    include "com.twelvemonkeys.imageio:imageio-webp:3.12.0"
    include "com.twelvemonkeys.imageio:imageio-core:3.12.0"
    include "com.twelvemonkeys.imageio:imageio-metadata:3.12.0"
    include "com.twelvemonkeys.common:common-lang:3.12.0"
    include "com.twelvemonkeys.common:common-io:3.12.0"
    include "com.twelvemonkeys.common:common-image:3.12.0"
}

processResources {
    inputs.property "version", project.version
    inputs.property "registry_url", project.registry_url
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
    filesMatching("neurocanvas-registry.properties") {
        expand "registry_url": project.registry_url
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE")
    from("licenses") {
        into "licenses"
    }
}
